name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build release for (e.g. v0.1.0, leave empty for latest git tag)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: vars
        run: |
          git fetch --tags || true
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${{ github.ref_name }}"
            else
              TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
            fi
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package macOS App Bundle
        run: |
          mkdir -p CelerTerm.app/Contents/MacOS
          mkdir -p CelerTerm.app/Contents/Resources
          cp target/release/celerterm CelerTerm.app/Contents/MacOS/celerterm
          chmod +x CelerTerm.app/Contents/MacOS/celerterm
          cp assets/Info.plist CelerTerm.app/Contents/Info.plist
          cp assets/AppIcon.icns CelerTerm.app/Contents/Resources/AppIcon.icns

      - name: Create DMG and ZIP
        run: |
          zip -r CelerTerm-macOS.app.zip CelerTerm.app
          mkdir -p dmg_root
          cp -R CelerTerm.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "CelerTerm" -srcfolder dmg_root -ov -format UDZO CelerTerm-macOS.dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            CelerTerm-macOS.dmg
            CelerTerm-macOS.app.zip

  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: vars
        run: |
          git fetch --tags || true
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${{ github.ref_name }}"
            else
              TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
            fi
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxkbcommon-dev libxcb-xfixes0-dev libxcb-render0-dev libxcb-shape0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package tar.gz
        run: |
          mkdir -p celerterm-linux-x86_64
          cp target/release/celerterm celerterm-linux-x86_64/
          cp assets/celerterm.desktop celerterm-linux-x86_64/
          cp assets/icon.png celerterm-linux-x86_64/celerterm.png
          cp README.md CHANGELOG.md LICENSE celerterm-linux-x86_64/
          tar -czvf celerterm-linux-x86_64.tar.gz celerterm-linux-x86_64

      - name: Package Debian .deb
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          DEB_DIR="celerterm_${VERSION}_amd64"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/512x512/apps"
          cp target/release/celerterm "${DEB_DIR}/usr/bin/"
          cp assets/celerterm.desktop "${DEB_DIR}/usr/share/applications/"
          cp assets/icon.png "${DEB_DIR}/usr/share/icons/hicolor/512x512/apps/celerterm.png"
          cat <<EOF > "${DEB_DIR}/DEBIAN/control"
          Package: celerterm
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: AM Software <info@amsoftware.com.vn>
          Description: A high-performance minimalist GPU-accelerated terminal emulator
          EOF
          dpkg-deb --build "${DEB_DIR}" "celerterm_${VERSION}_amd64.deb"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            celerterm-linux-x86_64.tar.gz
            *.deb

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: vars
        run: |
          git fetch --tags || true
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${{ github.ref_name }}"
            else
              TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
            fi
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract Release Notes from CHANGELOG
        run: |
          python3 -c "
          import re
          tag = '${{ steps.vars.outputs.tag }}'
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          tag_escaped = re.escape(tag.lstrip('v'))
          pattern = rf'(## \[[v]?{tag_escaped}\].*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
          else:
              notes = f'Release {tag}'
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(notes)
          "

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: CelerTerm ${{ steps.vars.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/macos-artifacts/*
            artifacts/linux-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Release Notes Synced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          if [ -f RELEASE_NOTES.md ]; then
            for i in {1..5}; do
              if gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file RELEASE_NOTES.md; then
                echo "Successfully updated $TAG release notes on GitHub!"
                break
              fi
              sleep 3
            done
          fi

